# Tassonomia dei temi per la classificazione di news e social.
temi:
  - sicurezza e ordine pubblico
  - centri sociali e manifestazioni
  - trasporti pubblici e metropolitana
  - traffico, parcheggi, ZTL
  - piste ciclabili e mobilità leggera
  - cantieri e lavori pubblici
  - verde pubblico e parchi
  - pulizia, rifiuti, decoro
  - casa, affitti, case popolari
  - commercio e mercati
  - lavoro e industria (automotive, indotto)
  - università e giovani
  - scuole e servizi per l'infanzia
  - sanità territoriale
  - anziani e servizi sociali
  - immigrazione e integrazione
  - cultura, eventi, turismo
  - sport e impianti
  - ambiente e qualità dell'aria
  - bilancio comunale e tasse locali
  - grandi opere (TAV, Linea 2, Parco della Salute)
  - politica e candidature
