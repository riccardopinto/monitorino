# Classificazione delle liste e dei candidati per area politica.
#
# PROPOSTA DA VERIFICARE: scritta il 2026-11-17 con questa regola, da correggere a mano.
# - Comunali e regionali: ogni lista prende l'area della coalizione del candidato collegato
#   (coalizioni dalle pagine di riepilogo del Comune su elezioni.comune.torino.it).
# - Coalizioni minori: "civici e terzo polo" se guidate da una lista civica, "altro" se guidate
#   da un partito fuori dai due poli e dal M5S.
# - Politiche: coalizioni nazionali del 2022. Europee: collocazione nazionale del partito.
#
# I nomi delle liste sono quelli dei file del Comune (troncati a 30 caratteri), da non cambiare.
# Se si modifica una classificazione, rieseguire: uv run python -m app.ingest.elezioni
#
# Formato:  "NOME LISTA": {forza: <nome normalizzato>, area: <area>, coalizione: <candidato>}
# "forza" è il nome che rende confrontabili liste di elezioni diverse.

aree: [centrosinistra, centrodestra, M5S, civici e terzo polo, altro]

