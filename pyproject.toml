[project]
name = "monitorino"
version = "0.1.0"
description = "Piattaforma interna di analisi e comunicazione per le elezioni comunali di Torino 2027"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.9.0",
    "apscheduler>=3.11.3",
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.163.1",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "playwright>=1.65.2",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
